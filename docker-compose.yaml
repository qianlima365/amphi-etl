services:
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile.new
    volumes:
      - amphi-workspace:/workspace
    # Ports are not exposed to host directly, only via nginx
    ports:
      - "8888:8888"
    environment:
      - JUPYTER_TOKEN=amphi
    depends_on:
      - ai-service

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    environment:
      - PORT=3001
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
    volumes:
      - sqlite-data:/app/data
    depends_on:
      - neo4j
  
  ontology-admin:
    build:
      context: ./ontology-admin
      dockerfile: Dockerfile
    depends_on:
      - ai-service

  neo4j:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/neo4j:5.26.7
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data

  nginx:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/nginx:alpine3.20
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - jupyter
      - ai-service

volumes:
  neo4j_data:
  sqlite-data:
  amphi-workspace:
