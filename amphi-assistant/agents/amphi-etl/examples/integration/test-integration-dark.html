<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ETL Agent 集成测试 - Dark Theme</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1d29 0%, #212636 100%);
      min-height: 100vh;
      color: #e8eaf6;
      padding: 40px 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    /* 头部 */
    .header {
      text-align: center;
      margin-bottom: 40px;
      padding: 30px;
      background: rgba(37, 42, 58, 0.6);
      border: 1px solid rgba(100, 116, 139, 0.2);
      border-radius: 16px;
      backdrop-filter: blur(10px);
    }

    .header h1 {
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }

    .header p {
      color: #94a3b8;
      font-size: 15px;
    }

    /* 测试卡片 */
    .test-card {
      margin-bottom: 24px;
      padding: 24px;
      background: #252a3a;
      border: 1px solid rgba(100, 116, 139, 0.2);
      border-radius: 12px;
      transition: all 0.3s;
    }

    .test-card:hover {
      border-color: rgba(59, 130, 246, 0.3);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .test-card h3 {
      font-size: 16px;
      font-weight: 600;
      color: #60a5fa;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .test-card h3::before {
      content: '';
      width: 4px;
      height: 20px;
      background: linear-gradient(180deg, #3b82f6 0%, #6366f1 100%);
      border-radius: 2px;
    }

    /* 输入框 */
    input[type="text"] {
      width: 100%;
      padding: 14px 18px;
      background: #1e2230;
      border: 1px solid rgba(100, 116, 139, 0.2);
      border-radius: 10px;
      font-size: 14px;
      color: #e2e8f0;
      margin-bottom: 12px;
      transition: all 0.2s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    input[type="text"]::placeholder {
      color: #64748b;
    }

    input[readonly] {
      background: rgba(30, 34, 48, 0.5);
      color: #64748b;
    }

    /* 按钮 */
    button {
      padding: 12px 28px;
      background: linear-gradient(135deg, #3b82f6 0%, #4f46e5 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
    }

    button:disabled {
      background: #3d4454;
      cursor: not-allowed;
      box-shadow: none;
    }

    button.secondary {
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #60a5fa;
      box-shadow: none;
    }

    button.secondary:hover:not(:disabled) {
      background: rgba(59, 130, 246, 0.2);
    }

    /* 结果展示 */
    .result {
      margin-top: 16px;
      padding: 16px 20px;
      background: #1e2230;
      border-radius: 10px;
      border-left: 3px solid #3b82f6;
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 13px;
      line-height: 1.6;
      color: #e2e8f0;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 300px;
      overflow-y: auto;
    }

    .result.success {
      border-left-color: #10b981;
      background: rgba(16, 185, 129, 0.05);
    }

    .result.error {
      border-left-color: #ef4444;
      background: rgba(239, 68, 68, 0.05);
      color: #fca5a5;
    }

    /* 状态标签 */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }

    .status-badge.success {
      background: rgba(16, 185, 129, 0.1);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .status-badge.error {
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .status-badge.pending {
      background: rgba(245, 158, 11, 0.1);
      color: #f59e0b;
      border: 1px solid rgba(245, 158, 11, 0.2);
    }

    /* 提示框 */
    .hint {
      margin-top: 12px;
      padding: 14px 18px;
      background: rgba(245, 158, 11, 0.05);
      border: 1px solid rgba(245, 158, 11, 0.2);
      border-radius: 10px;
      font-size: 13px;
      color: #fbbf24;
      line-height: 1.6;
    }

    .hint code {
      background: rgba(251, 191, 36, 0.1);
      padding: 2px 8px;
      border-radius: 4px;
      font-family: monospace;
      color: #fbbf24;
    }

    /* 步骤指示器 */
    .steps {
      display: flex;
      gap: 16px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .step {
      flex: 1;
      min-width: 140px;
      padding: 16px;
      background: #1e2230;
      border: 1px solid rgba(100, 116, 139, 0.2);
      border-radius: 10px;
      text-align: center;
    }

    .step-number {
      width: 28px;
      height: 28px;
      margin: 0 auto 10px;
      background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
    }

    .step-label {
      font-size: 12px;
      color: #94a3b8;
    }

    /* 滚动条 */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #1e2230;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.3);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 116, 139, 0.5);
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 头部 -->
    <div class="header">
      <h1>🔧 ETL Agent 集成测试工具</h1>
      <p>测试你的集成配置是否正确</p>
    </div>

    <!-- API 配置 -->
    <div class="test-card">
      <h3>1. API 配置</h3>
      <input type="text" id="apiUrl" placeholder="API 地址" value="http://localhost:3001/api/chat">
      <div class="hint">
        💡 如果直接访问 ETL Agent API（跨域），需要启动代理服务：<br>
        <code>node express-proxy.js</code>
      </div>
    </div>

    <!-- 连接测试 -->
    <div class="test-card">
      <h3>2. 连接测试</h3>
      <button onclick="testConnection()">测试连接</button>
      <div id="connectionResult"></div>
    </div>

    <!-- 创建会话 -->
    <div class="test-card">
      <h3>3. 创建会话</h3>
      <input type="text" id="userId" placeholder="用户ID（可选）" value="test-user">
      <button onclick="createSession()">创建会话</button>
      <div id="sessionResult"></div>
    </div>

    <!-- 发送消息 -->
    <div class="test-card">
      <h3>4. 发送消息</h3>
      <input type="text" id="sessionId" placeholder="会话ID（先创建会话）" readonly>
      <input type="text" id="message" placeholder="输入消息，例如：把CSV导入MySQL">
      <button onclick="sendMessage()" id="sendBtn" disabled>发送消息</button>
      <div id="messageResult"></div>
    </div>

    <!-- 完整流程测试 -->
    <div class="test-card">
      <h3>5. 完整流程测试</h3>
      <button onclick="runFullTest()">运行完整测试</button>
      
      <div class="steps">
        <div class="step">
          <div class="step-number">1</div>
          <div class="step-label">创建会话</div>
        </div>
        <div class="step">
          <div class="step-number">2</div>
          <div class="step-label">发送需求</div>
        </div>
        <div class="step">
          <div class="step-number">3</div>
          <div class="step-label">提供参数</div>
        </div>
        <div class="step">
          <div class="step-number">4</div>
          <div class="step-label">确认生成</div>
        </div>
      </div>
      
      <div id="fullTestResult"></div>
    </div>
  </div>

  <script>
    function showResult(elementId, content, isError = false) {
      const el = document.getElementById(elementId);
      el.className = 'result ' + (isError ? 'error' : 'success');
      el.textContent = content;
    }

    function clearResult(elementId) {
      const el = document.getElementById(elementId);
      el.className = 'result';
      el.textContent = '';
    }

    async function testConnection() {
      const apiUrl = document.getElementById('apiUrl').value.trim();
      clearResult('connectionResult');

      try {
        const response = await fetch(`${apiUrl}/session`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: 'test' }),
        });

        if (response.ok) {
          showResult('connectionResult', '✅ 连接成功！API 服务正常运行');
        } else {
          showResult('connectionResult', `❌ 连接失败: HTTP ${response.status}`, true);
        }
      } catch (error) {
        showResult('connectionResult', `❌ 连接失败: ${error.message}\n\n请检查：\n1. API 地址是否正确\n2. 代理服务是否已启动\n3. ETL Agent API 是否已启动`, true);
      }
    }

    async function createSession() {
      const apiUrl = document.getElementById('apiUrl').value.trim();
      const userId = document.getElementById('userId').value.trim() || 'test-user';
      clearResult('sessionResult');

      try {
        const response = await fetch(`${apiUrl}/session`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId }),
        });

        const data = await response.json();

        if (data.success) {
          document.getElementById('sessionId').value = data.sessionId;
          document.getElementById('sendBtn').disabled = false;
          showResult('sessionResult', `✅ 会话创建成功\n会话ID: ${data.sessionId}`);
        } else {
          showResult('sessionResult', `❌ 创建失败: ${data.error}`, true);
        }
      } catch (error) {
        showResult('sessionResult', `❌ 错误: ${error.message}`, true);
      }
    }

    async function sendMessage() {
      const apiUrl = document.getElementById('apiUrl').value.trim();
      const sessionId = document.getElementById('sessionId').value.trim();
      const message = document.getElementById('message').value.trim();

      if (!sessionId) {
        showResult('messageResult', '❌ 请先创建会话', true);
        return;
      }

      if (!message) {
        showResult('messageResult', '❌ 请输入消息', true);
        return;
      }

      clearResult('messageResult');
      document.getElementById('sendBtn').disabled = true;
      document.getElementById('sendBtn').textContent = '发送中...';

      try {
        const response = await fetch(`${apiUrl}/message`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId, message, userId: 'test-user' }),
        });

        const data = await response.json();

        if (data.success) {
          showResult('messageResult', 
            `✅ 消息发送成功\n\n` +
            `阶段: ${data.data.phase}\n` +
            `是否完成: ${data.data.isComplete}\n` +
            `响应:\n${data.data.response}`
          );
        } else {
          showResult('messageResult', `❌ 发送失败: ${data.error}`, true);
        }
      } catch (error) {
        showResult('messageResult', `❌ 错误: ${error.message}`, true);
      } finally {
        document.getElementById('sendBtn').disabled = false;
        document.getElementById('sendBtn').textContent = '发送消息';
      }
    }

    async function runFullTest() {
      const results = [];
      const apiUrl = document.getElementById('apiUrl').value.trim();
      const userId = 'full-test-user';

      results.push('🚀 开始完整流程测试...\n');
      updateFullTestResult(results.join('\n'));

      try {
        results.push('1️⃣ 创建会话...');
        updateFullTestResult(results.join('\n'));

        const sessionRes = await fetch(`${apiUrl}/session`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId }),
        });
        const sessionData = await sessionRes.json();

        if (!sessionData.success) throw new Error(sessionData.error);

        const sessionId = sessionData.sessionId;
        results.push(`   ✅ 会话创建成功: ${sessionId.slice(0, 8)}...\n`);
        updateFullTestResult(results.join('\n'));

        results.push('2️⃣ 发送需求: "把CSV导入MySQL"...');
        updateFullTestResult(results.join('\n'));

        const msgRes = await fetch(`${apiUrl}/message`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId, message: '把CSV导入MySQL', userId }),
        });
        const msgData = await msgRes.json();

        if (!msgData.success) throw new Error(msgData.error);

        results.push(`   ✅ 收到响应`);
        results.push(`   阶段: ${msgData.data.phase}`);
        results.push(`   响应: ${msgData.data.response.slice(0, 100)}...\n`);
        updateFullTestResult(results.join('\n'));

        results.push('3️⃣ 提供参数...');
        updateFullTestResult(results.join('\n'));

        const paramRes = await fetch(`${apiUrl}/message`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId, message: '主机 localhost，端口 3306', userId }),
        });
        const paramData = await paramRes.json();

        results.push(`   ✅ 参数已记录`);
        results.push(`   阶段: ${paramData.data.phase}\n`);
        updateFullTestResult(results.join('\n'));

        results.push('4️⃣ 确认生成 Pipeline...');
        updateFullTestResult(results.join('\n'));

        const confirmRes = await fetch(`${apiUrl}/message`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId, message: '确认', userId }),
        });
        const confirmData = await confirmRes.json();

        results.push(`   ✅ 生成完成`);
        results.push(`   阶段: ${confirmData.data.phase}`);
        if (confirmData.data.pipelineFile) {
          results.push(`   Pipeline文件: ${confirmData.data.pipelineFile}`);
        }

        results.push('\n🎉 完整测试通过！');
        updateFullTestResult(results.join('\n'), false);

      } catch (error) {
        results.push(`\n❌ 测试失败: ${error.message}`);
        updateFullTestResult(results.join('\n'), true);
      }
    }

    function updateFullTestResult(content, isError = false) {
      showResult('fullTestResult', content, isError);
    }
  </script>

</body>
</html>
