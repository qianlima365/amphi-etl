<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ETL 智能助手 - 嵌入示例</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }

    /* 悬浮按钮 */
    .chat-float-btn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0,123,255,0.4);
      font-size: 24px;
      z-index: 9998;
      transition: transform 0.2s;
    }

    .chat-float-btn:hover {
      transform: scale(1.1);
    }

    /* 聊天窗口 */
    .chat-widget {
      position: fixed;
      bottom: 100px;
      right: 30px;
      width: 380px;
      height: 600px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      display: none;
      flex-direction: column;
      z-index: 9999;
      overflow: hidden;
    }

    .chat-widget.active {
      display: flex;
    }

    /* 头部 */
    .chat-header {
      padding: 16px 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .chat-header h3 {
      font-size: 16px;
      margin-bottom: 4px;
    }

    .chat-header p {
      font-size: 12px;
      opacity: 0.9;
    }

    .chat-header .status {
      margin-top: 8px;
      font-size: 11px;
      padding: 4px 8px;
      background: rgba(255,255,255,0.2);
      border-radius: 12px;
      display: inline-block;
    }

    /* 消息区域 */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      background: #007bff;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.bot {
      align-self: flex-start;
      background: #f1f3f4;
      color: #333;
      border-bottom-left-radius: 4px;
    }

    .message.error {
      background: #ffebee;
      color: #c62828;
    }

    .message .pipeline-badge {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 10px;
      background: #28a745;
      color: white;
      border-radius: 4px;
      font-size: 11px;
    }

    /* 输入区域 */
    .chat-input-area {
      padding: 12px 16px;
      border-top: 1px solid #e0e0e0;
      display: flex;
      gap: 8px;
    }

    .chat-input {
      flex: 1;
      padding: 10px 16px;
      border: 1px solid #ddd;
      border-radius: 20px;
      font-size: 14px;
      outline: none;
    }

    .chat-input:focus {
      border-color: #007bff;
    }

    .chat-send {
      padding: 10px 20px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
    }

    .chat-send:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    /* 关闭按钮 */
    .chat-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-close:hover {
      background: rgba(255,255,255,0.3);
    }

    /* 演示说明 */
    .demo-info {
      max-width: 800px;
      margin: 0 auto 40px;
      padding: 24px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .demo-info h1 {
      font-size: 24px;
      margin-bottom: 16px;
      color: #333;
    }

    .demo-info p {
      color: #666;
      line-height: 1.8;
      margin-bottom: 12px;
    }

    .demo-info code {
      background: #f4f4f4;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      color: #e83e8c;
    }
  </style>
</head>
<body>

  <!-- 演示说明 -->
  <div class="demo-info">
    <h1>🤖 ETL 智能助手 - 嵌入示例</h1>
    <p>这是一个可嵌入任何网页的对话组件示例。</p>
    <p>点击右下角的悬浮按钮打开聊天窗口，即可与 ETL 智能助手对话。</p>
    <p>集成方式：复制 <code>&lt;script&gt;</code> 代码到你的网页即可。</p>
  </div>

  <!-- 悬浮按钮 -->
  <button class="chat-float-btn" onclick="toggleChat()">💬</button>

  <!-- 聊天窗口 -->
  <div class="chat-widget" id="chatWidget">
    <div class="chat-header">
      <button class="chat-close" onclick="toggleChat()">×</button>
      <h3>🤖 ETL 智能助手</h3>
      <p>告诉我你的数据处理需求</p>
      <span class="status" id="statusBadge">准备就绪</span>
    </div>
    
    <div class="chat-messages" id="messages">
      <!-- 消息将动态插入这里 -->
    </div>
    
    <div class="chat-input-area">
      <input 
        type="text" 
        class="chat-input" 
        id="chatInput" 
        placeholder="输入你的需求..."
        onkeypress="handleKeyPress(event)"
      />
      <button class="chat-send" id="sendBtn" onclick="sendMessage()">发送</button>
    </div>
  </div>

  <script>
    // 配置
    const CONFIG = {
      // 后端 API 地址（需要替换为实际的代理服务地址）
      apiBaseUrl: 'http://localhost:3001/api/chat',
      // 用户标识
      userId: 'web-user-' + Date.now(),
    };

    // 状态
    let sessionId = null;
    let isLoading = false;
    let currentPhase = 'INITIAL';

    // 切换聊天窗口显示
    function toggleChat() {
      const widget = document.getElementById('chatWidget');
      widget.classList.toggle('active');
      
      // 首次打开时创建会话
      if (widget.classList.contains('active') && !sessionId) {
        createSession();
      }
    }

    // 创建会话
    async function createSession() {
      try {
        updateStatus('连接中...');
        
        const response = await fetch(`${CONFIG.apiBaseUrl}/session`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: CONFIG.userId }),
        });
        
        const data = await response.json();
        if (data.success) {
          sessionId = data.sessionId;
          updateStatus('在线');
          addMessage('bot', '你好！我是 ETL 智能助手。\n\n请描述你的数据处理需求，例如：\n• "把CSV文件导入MySQL数据库"\n• "从PostgreSQL导出数据到CSV"\n• "同步两个数据库的表数据"');
        } else {
          throw new Error(data.error);
        }
      } catch (error) {
        console.error('创建会话失败:', error);
        updateStatus('连接失败');
        addMessage('bot', '抱歉，连接服务失败，请稍后重试。', true);
      }
    }

    // 发送消息
    async function sendMessage() {
      const input = document.getElementById('chatInput');
      const message = input.value.trim();
      
      if (!message || isLoading || !sessionId) return;
      
      // 清空输入
      input.value = '';
      
      // 添加用户消息
      addMessage('user', message);
      
      // 设置加载状态
      isLoading = true;
      updateStatus('思考中...');
      document.getElementById('sendBtn').disabled = true;
      
      try {
        const response = await fetch(`${CONFIG.apiBaseUrl}/message`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sessionId,
            message,
            userId: CONFIG.userId,
          }),
        });
        
        const data = await response.json();
        
        if (data.success) {
          const { response: botResponse, phase, isComplete, pipelineFile } = data.data;
          
          currentPhase = phase;
          
          // 构建消息内容
          let content = botResponse;
          let extraHtml = '';
          
          if (isComplete && pipelineFile) {
            extraHtml = '<span class="pipeline-badge">📁 Pipeline 已生成</span>';
            updateStatus('完成');
          } else {
            updateStatus(getPhaseLabel(phase));
          }
          
          addMessage('bot', content, false, extraHtml);
        } else {
          throw new Error(data.error);
        }
      } catch (error) {
        console.error('发送消息失败:', error);
        addMessage('bot', '抱歉，处理消息时出现错误，请重试。', true);
        updateStatus('错误');
      } finally {
        isLoading = false;
        document.getElementById('sendBtn').disabled = false;
      }
    }

    // 添加消息到界面
    function addMessage(role, content, isError = false, extraHtml = '') {
      const messagesContainer = document.getElementById('messages');
      const messageDiv = document.createElement('div');
      
      messageDiv.className = `message ${role}${isError ? ' error' : ''}`;
      messageDiv.innerHTML = formatMessage(content) + extraHtml;
      
      messagesContainer.appendChild(messageDiv);
      scrollToBottom();
    }

    // 格式化消息（处理换行）
    function formatMessage(content) {
      return content
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\n/g, '<br>');
    }

    // 滚动到底部
    function scrollToBottom() {
      const container = document.getElementById('messages');
      container.scrollTop = container.scrollHeight;
    }

    // 处理回车键
    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        sendMessage();
      }
    }

    // 更新状态
    function updateStatus(status) {
      document.getElementById('statusBadge').textContent = status;
    }

    // 获取阶段标签
    function getPhaseLabel(phase) {
      const labels = {
        INITIAL: '初始',
        PROPOSING: '方案',
        COLLECTING: '收集',
        CONFIRMING: '确认',
        COMPLETED: '完成',
      };
      return labels[phase] || '处理中';
    }
  </script>

</body>
</html>
