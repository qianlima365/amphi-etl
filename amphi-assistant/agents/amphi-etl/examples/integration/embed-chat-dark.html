<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ETL 智能助手 - Dark Theme</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1d29 0%, #212636 100%);
      min-height: 100vh;
      color: #e8eaf6;
    }

    /* 主容器 - 参考截图的卡片风格 */
    .demo-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .demo-header {
      margin-bottom: 40px;
      padding: 30px;
      background: rgba(37, 42, 58, 0.6);
      border: 1px solid rgba(100, 116, 139, 0.2);
      border-radius: 12px;
      backdrop-filter: blur(10px);
    }

    .demo-header h1 {
      font-size: 28px;
      font-weight: 600;
      background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }

    .demo-header p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.6;
    }

    /* 悬浮按钮 - 科技蓝光 */
    .chat-float-btn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
      color: white;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(59, 130, 246, 0.4);
      font-size: 24px;
      z-index: 9998;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-float-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 30px rgba(59, 130, 246, 0.6);
    }

    .chat-float-btn::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: inherit;
      opacity: 0.4;
      animation: pulse 2s infinite;
      z-index: -1;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.2); opacity: 0; }
      100% { transform: scale(1); opacity: 0; }
    }

    /* 聊天窗口 - 深色卡片风格 */
    .chat-widget {
      position: fixed;
      bottom: 100px;
      right: 30px;
      width: 420px;
      height: 640px;
      background: #252a3a;
      border: 1px solid rgba(100, 116, 139, 0.2);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      display: none;
      flex-direction: column;
      z-index: 9999;
      overflow: hidden;
    }

    .chat-widget.active {
      display: flex;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(20px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* 头部 - 渐变蓝色 */
    .chat-header {
      padding: 20px 24px;
      background: linear-gradient(135deg, #1e3a5f 0%, #2d4a6f 100%);
      color: white;
      position: relative;
      border-bottom: 1px solid rgba(100, 116, 139, 0.2);
    }

    .chat-header h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chat-header p {
      font-size: 12px;
      opacity: 0.8;
      color: #94a3b8;
    }

    .header-status {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    .status-text {
      font-size: 11px;
      color: #94a3b8;
      padding: 4px 10px;
      background: rgba(15, 23, 42, 0.5);
      border-radius: 12px;
      border: 1px solid rgba(100, 116, 139, 0.2);
    }

    .phase-badge {
      font-size: 10px;
      padding: 2px 8px;
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      border-radius: 10px;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    /* 关闭按钮 */
    .chat-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94a3b8;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .chat-close:hover {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      border-color: rgba(239, 68, 68, 0.3);
    }

    /* 消息区域 */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: #1e2230;
    }

    .chat-messages::-webkit-scrollbar {
      width: 6px;
    }

    .chat-messages::-webkit-scrollbar-track {
      background: transparent;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.3);
      border-radius: 3px;
    }

    /* 消息气泡 */
    .message {
      max-width: 85%;
      padding: 14px 18px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
      animation: fadeIn 0.3s ease;
      position: relative;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #3b82f6 0%, #4f46e5 100%);
      color: white;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
    }

    .message.bot {
      align-self: flex-start;
      background: #2d3347;
      color: #e2e8f0;
      border-bottom-left-radius: 4px;
      border: 1px solid rgba(100, 116, 139, 0.15);
    }

    .message.error {
      background: rgba(239, 68, 68, 0.1);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .message-time {
      font-size: 10px;
      color: rgba(148, 163, 184, 0.6);
      margin-top: 6px;
    }

    .message.user .message-time {
      color: rgba(255, 255, 255, 0.6);
    }

    /* Pipeline 徽章 */
    .pipeline-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      padding: 8px 14px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
    }

    /* 输入区域 */
    .chat-input-area {
      padding: 16px 20px;
      background: #252a3a;
      border-top: 1px solid rgba(100, 116, 139, 0.2);
      display: flex;
      gap: 12px;
    }

    .chat-input {
      flex: 1;
      padding: 12px 18px;
      background: #1e2230;
      border: 1px solid rgba(100, 116, 139, 0.2);
      border-radius: 12px;
      font-size: 14px;
      color: #f0f6fc; /* 修复：更亮的白色 */
      outline: none;
      transition: all 0.2s;
    }

    .chat-input::placeholder {
      color: #8b949e;
    }

    .chat-input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .chat-send {
      padding: 12px 24px;
      background: linear-gradient(135deg, #3b82f6 0%, #4f46e5 100%);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
    }

    .chat-send:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
    }

    .chat-send:disabled {
      background: #3d4454;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* 加载动画 */
    .typing-indicator {
      display: inline-flex;
      gap: 4px;
      padding: 4px 0;
    }

    .typing-indicator span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #60a5fa;
      animation: bounce 1.4s infinite ease-in-out;
    }

    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* 配置面板 */
    .config-panel {
      margin-bottom: 30px;
      padding: 24px;
      background: rgba(37, 42, 58, 0.6);
      border: 1px solid rgba(100, 116, 139, 0.2);
      border-radius: 12px;
    }

    .config-title {
      font-size: 14px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .config-input {
      width: 100%;
      padding: 12px 16px;
      background: #1e2230;
      border: 1px solid rgba(100, 116, 139, 0.2);
      border-radius: 8px;
      font-size: 14px;
      color: #e2e8f0;
      margin-bottom: 12px;
    }

    .config-button {
      padding: 10px 20px;
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 8px;
      color: #60a5fa;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }

    .config-button:hover {
      background: rgba(59, 130, 246, 0.2);
    }
  </style>
</head>
<body>

  <div class="demo-container">
    <!-- 演示说明 -->
    <div class="demo-header">
      <h1>🤖 ETL 智能助手</h1>
      <p>基于 Neo4j 知识图谱的 ETL Pipeline 智能生成助手</p>
    </div>

    <!-- 配置面板 -->
    <div class="config-panel">
      <div class="config-title">API 配置</div>
      <input type="text" id="apiUrl" class="config-input" 
             placeholder="API 地址" value="http://localhost:3001/api/chat">
    </div>
  </div>

  <!-- 悬浮按钮 -->
  <button class="chat-float-btn" onclick="toggleChat()">💬</button>

  <!-- 聊天窗口 -->
  <div class="chat-widget" id="chatWidget">
    <div class="chat-header">
      <button class="chat-close" onclick="toggleChat()">×</button>
      <h3>🤖 ETL 智能助手</h3>
      <p>告诉我你的数据处理需求</p>
      <div class="header-status">
        <span class="status-dot"></span>
        <span class="status-text" id="statusBadge">准备就绪</span>
        <span class="phase-badge" id="phaseBadge">INITIAL</span>
      </div>
    </div>
    
    <div class="chat-messages" id="messages">
      <!-- 消息将动态插入这里 -->
    </div>
    
    <div class="chat-input-area">
      <input 
        type="text" 
        class="chat-input" 
        id="chatInput" 
        placeholder="输入你的需求..."
        onkeypress="handleKeyPress(event)"
      />
      <button class="chat-send" id="sendBtn" onclick="sendMessage()">发送</button>
    </div>
  </div>

  <script>
    // 配置
    const CONFIG = {
      apiBaseUrl: 'http://localhost:3001/api/chat',
      userId: 'web-user-' + Date.now(),
    };

    let sessionId = null;
    let isLoading = false;
    let currentPhase = 'INITIAL';

    // 切换聊天窗口显示
    function toggleChat() {
      const widget = document.getElementById('chatWidget');
      widget.classList.toggle('active');
      
      if (widget.classList.contains('active') && !sessionId) {
        createSession();
      }
    }

    // 创建会话
    async function createSession() {
      try {
        updateStatus('连接中...', 'connecting');
        
        const response = await fetch(`${CONFIG.apiBaseUrl}/session`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: CONFIG.userId }),
        });
        
        const data = await response.json();
        if (data.success) {
          sessionId = data.sessionId;
          updateStatus('在线', 'online');
          addMessage('bot', '你好！我是 ETL 智能助手。\n\n请描述你的数据处理需求，例如：\n• "把CSV文件导入MySQL数据库"\n• "从PostgreSQL导出数据到CSV"\n• "同步两个数据库的表数据"');
        } else {
          throw new Error(data.error);
        }
      } catch (error) {
        console.error('创建会话失败:', error);
        updateStatus('连接失败', 'error');
        addMessage('bot', '抱歉，连接服务失败，请稍后重试。', true);
      }
    }

    // 发送消息
    async function sendMessage() {
      const input = document.getElementById('chatInput');
      const message = input.value.trim();
      
      if (!message || isLoading || !sessionId) return;
      
      input.value = '';
      addMessage('user', message);
      
      isLoading = true;
      updateStatus('思考中...', 'thinking');
      document.getElementById('sendBtn').disabled = true;
      
      try {
        const response = await fetch(`${CONFIG.apiBaseUrl}/message`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sessionId,
            message,
            userId: CONFIG.userId,
          }),
        });
        
        const data = await response.json();
        
        if (data.success) {
          const { response: botResponse, phase, isComplete, pipelineFile } = data.data;
          
          currentPhase = phase;
          updatePhaseBadge(phase);
          
          let extraHtml = '';
          if (isComplete && pipelineFile) {
            extraHtml = '<div class="pipeline-badge">📁 Pipeline 已生成</div>';
            updateStatus('完成', 'complete');
          } else {
            updateStatus('在线', 'online');
          }
          
          addMessage('bot', botResponse, false, extraHtml);
        } else {
          throw new Error(data.error);
        }
      } catch (error) {
        console.error('发送消息失败:', error);
        addMessage('bot', '抱歉，处理消息时出现错误，请重试。', true);
        updateStatus('错误', 'error');
      } finally {
        isLoading = false;
        document.getElementById('sendBtn').disabled = false;
      }
    }

    // 添加消息到界面
    function addMessage(role, content, isError = false, extraHtml = '') {
      const messagesContainer = document.getElementById('messages');
      const messageDiv = document.createElement('div');
      
      const time = new Date().toLocaleTimeString('zh-CN', { 
        hour: '2-digit', 
        minute: '2-digit' 
      });
      
      messageDiv.className = `message ${role}${isError ? ' error' : ''}`;
      messageDiv.innerHTML = 
        formatMessage(content) + 
        `<div class="message-time">${time}</div>` +
        extraHtml;
      
      messagesContainer.appendChild(messageDiv);
      scrollToBottom();
    }

    function formatMessage(content) {
      return content
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\n/g, '<br>');
    }

    function scrollToBottom() {
      const container = document.getElementById('messages');
      container.scrollTop = container.scrollHeight;
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        sendMessage();
      }
    }

    function updateStatus(status, type) {
      document.getElementById('statusBadge').textContent = status;
      const dot = document.querySelector('.status-dot');
      
      const colors = {
        online: '#10b981',
        thinking: '#f59e0b',
        error: '#ef4444',
        complete: '#10b981',
        connecting: '#3b82f6',
      };
      
      dot.style.background = colors[type] || '#64748b';
      dot.style.boxShadow = `0 0 8px ${colors[type] || '#64748b'}`;
    }

    function updatePhaseBadge(phase) {
      const badge = document.getElementById('phaseBadge');
      const labels = {
        INITIAL: '初始',
        PROPOSING: '方案',
        COLLECTING: '收集',
        CONFIRMING: '确认',
        COMPLETED: '完成',
      };
      badge.textContent = labels[phase] || phase;
    }
  </script>

</body>
</html>
