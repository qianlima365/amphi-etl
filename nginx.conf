events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    upstream jupyter {
        server jupyter:8888;
    }

    upstream aiservice {
        server ai-service:3001;
    }

    server {
        listen 80;

        # Proxy for AI Service
        location /ai/ {
            proxy_pass http://aiservice/ai/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        location /agent/ {
            proxy_pass http://aiservice/agent/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /ontology/ {
            proxy_pass http://aiservice/ontology/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        location /api-docs/ {
            proxy_pass http://aiservice/api-docs/;
            proxy_set_header Host $host;
        }
        
        location /db-admin/ {
            proxy_pass http://aiservice/db-admin/;
            proxy_set_header Host $host;
        }
        
        location /health {
            proxy_pass http://aiservice/health;
            proxy_set_header Host $host;
        }

        # Main JupyterLab Proxy
        location / {
            proxy_pass http://jupyter;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
